# dsh-netguard 的示例配置（bundle patch）。
#
# 这里每一项都是"安全 vs 好用"的取舍，动之前先想清楚放宽的是哪一头。
# 默认值都是保守的那一侧：宁可挡住一个无辜的地址（用户能看见错误、能改配置），
# 也不要放过一个内网地址（没人会看见，内网内容已经出去了）。
- insert:
    - id: netguard
      name: dsh-netguard
      config:
        # ---- 协议：只放这两种 ----
        # file: / gopher: / dict: / ftp: / data: 都是经典的 SSRF 跳板。
        # file:// 能直接读服务器上的本地文件，比 http 更狠。
        allowedProtocols:
          - 'http:'
          - 'https:'

        # ---- 大小：一次最多下载多少字节 ----
        # 默认 8 MiB，和"单张图上限"一个量级。这个数只影响单次抓取，
        # 不会因为并发而被突破，但也不做全局配额（见 README「已知局限」）。
        maxBytes: 8388608

        # 超上限怎么办：
        #   error    = 报错（默认）。拉图/拉音频这类"要完整字节"的场景必须用这个 ——
        #              半张 JPEG 解不出图，可流量已经花掉了，最后报的错还更难查。
        #   truncate = 截断到上限继续用。适合"我只要前面一段"（比如网页正文前 64KB）。
        onOverflow: error

        # ---- 超时：整条链（含所有重定向）共用这一个预算 ----
        # 20 秒够拉常见的图片和网页；再长说明对面有问题，不该把 Agent 那一轮拖住。
        timeoutMs: 20000

        # ---- 重定向：跟不跟、最多几跳 ----
        # 关掉最安全（一个跳转都不跟），但很多正经 CDN 靠 301/302 工作。
        # 开着也行 —— 因为这个插件**每一跳都会重新体检**：
        # 302 到 127.0.0.1 / 169.254.169.254 / 解析进内网的域名，一样会被挡下来。
        allowRedirects: true
        maxRedirects: 3

        # ---- 端口黑名单 ----
        # 这些端口几乎不对外提供"公网内容"，却是内网服务的常客（22 SSH、6379 Redis…）。
        # 8080 / 3000 / 8443 这些开发端口不在名单里，照常用。
        # 想全放行就写 []（代价：内网那些端口也一起放开了）。
        blockedPorts: [22, 23, 25, 110, 143, 445, 993, 995, 3306, 5432, 6379, 11211, 27017]

        # ---- 地址写法 ----
        # 允许 URL 里带 user:pass@ 吗？默认不允许：
        #   http://trusted.example.com@127.0.0.1:8080/
        # 人眼只看前面那个域名，解析器连的却是 @ 后面的主机 —— 关掉这一类伪装。
        allowUrlCredentials: false

        # 允许单段主机名吗（http://intranet/ 这种没有点的）？
        # 内网服务名几乎都是单段的，公网站点必然有域名 —— 默认不允许。
        allowSingleLabel: false

        # 出网用的 User-Agent。别写宿主自己的：对外要能看出是谁在拉。
        userAgent: dsh-netguard/0.1.0

        # ---- 工具开关（默认关）----
        # fetch_url 会把外部内容原样喂进模型上下文，等于开了一条
        # "外部内容 → 模型"的管道（拉回来的页面里可能写着"忽略之前的指令"）。
        # 服务出口不受这个开关影响：别的插件想拉东西随时能调 ctx.get('netguard')。
        enableTool: false

        # 工具最多回多少字符正文（外部页面动辄几百 KB，全塞进上下文又贵又容易被埋雷）。
        # 注意这只裁"给模型的文本"，字节本身仍然受 maxBytes 约束。
        toolMaxChars: 20000
